# Firewall configuration.
#
# This file defines the one boundary in this repository that is not up for
# design discussion: the ensemble generator must not see partisan or racial
# data, by any path.
#
# DO NOT EDIT THIS FILE to make a check pass. If a legitimate need arises to
# change it, that is a decision for a human, recorded in a commit that changes
# nothing else, with a note explaining why every result produced before it is
# now suspect.

# Packages, and which siblings each may import from.
# An empty allowed list means the package may import nothing from src/.
packages:
  generate:
    allowed_imports: []
    forbidden_columns: true    # apply the column denylist below
    rationale: >
      Produces the neutral baseline ensemble. If partisan or demographic data
      reaches this package by any route, the baseline is not neutral and every
      outlier claim built on it is void.

  evaluate:
    allowed_imports: []
    forbidden_columns: false
    rationale: >
      Computes partisan, demographic, compactness, and administrative metrics.
      Strictly downstream. Must not be imported by generate.

  adversarial:
    allowed_imports: [evaluate]
    forbidden_columns: false
    rationale: >
      Deliberately partisan. Builds known gerrymanders with known intent and
      magnitude, to serve as ground truth for the detector. Must never be
      imported by generate — its whole purpose is the thing generate must not do.

  detect:
    allowed_imports: [generate, evaluate, adversarial]
    forbidden_columns: false
    rationale: >
      Compares a plan against an ensemble. Legitimately downstream of everything.

# Identifiers and string literals that must not appear anywhere under a package
# with forbidden_columns: true. Case-insensitive substring match on identifiers
# and string constants.
#
# These cover the column naming conventions used by VEST, the ALARM 2020
# Redistricting Data Files, and Dave's Redistricting exports.
column_denylist:
  # Election results — VEST/ALARM conventions
  - pre_
  - gov_
  - sen_
  - uss_
  - ussen
  - atg_
  - sos_
  - _dem
  - _rep
  - _dvote
  - _rvote
  - ndv          # normalized Democratic vote
  - nrv          # normalized Republican vote
  - adv          # aggregate Democratic vote
  - arv          # aggregate Republican vote
  # Party
  - democrat
  - republican
  - partisan
  - vote_share
  - voteshare
  - two_party
  # Race and ethnicity
  - vap_black
  - vap_hisp
  - vap_white
  - vap_asian
  - vap_amin
  - vap_nhpi
  - vap_two
  - blackvap
  - hispvap
  - whitevap
  - asianvap
  - blackpop
  - hisppop
  - whitepop
  - pop_black
  - pop_hisp
  - pop_white

# Identifiers that are explicitly permitted despite matching a denylist pattern.
# Keep this list as short as possible and justify each entry inline.
column_allowlist:
  - representation   # matches "_rep"; ordinary English word
  - repr             # matches "_rep"; Python builtin
  - repeat           # matches "_rep"
  - report           # matches "_rep"
  - deprecated       # matches "_rep"
  - prepare          # matches "pre_" reversed forms in some casings
  - preprocess
  - precinct         # matches "pre_"; the fundamental geographic unit
  - precision
  - predicate
  - prefix
  - preserve
  - present
  - previous
